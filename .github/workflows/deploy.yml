name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout репозиторий
      - name: Checkout code
        uses: actions/checkout@v3

      # Установить SSH-агент
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Копировать файлы на сервер
      - name: Copy files to server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./docker-compose.yml ./Dockerfile ./.dockerignore ./.env.example /src ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/app/

      # Выполнить деплой на сервере
      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/deploy/app
          docker-compose pull
          docker-compose up -d --build
          EOF